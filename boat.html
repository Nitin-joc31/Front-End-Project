<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ocean Wave with Boat</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: radial-gradient(ellipse at center, #fffeea 0%, #fffeea 35%, #B7E8EB 100%);
      overflow: hidden;
    }

    .ocean {
      height: 5%;
      width: 100%;
      position: absolute;
      bottom: 0;
      left: 0;
      background: #015871;
    }

    .wave {
      background: #2b8794;
      clip-path: polygon(
        0 55%, 5% 48%, 10% 41%, 15% 36%, 20% 34%, 25% 38%,
        30% 46%, 35% 52%, 40% 55%, 45% 57%, 50% 55%,
        55% 48%, 60% 41%, 65% 36%, 70% 34%, 75% 38%,
        80% 46%, 85% 52%, 90% 55%, 95% 57%, 100% 55%,
        100% 100%, 0 100%
      );
      position: absolute;
      top: -198px;
      width: 200%;
      height: 198px;
      animation: wave 7s cubic-bezier(0.36, 0.45, 0.63, 0.53) infinite;
      transform: translate3d(0, 0, 0);
    }

    .wave:nth-of-type(2) {
      top: -175px;
      background: #78c9cf;
      animation: wave 7s cubic-bezier(0.36, 0.45, 0.63, 0.53) -0.125s infinite,
                 swell 7s ease -1.25s infinite;
      opacity: 0.8;
    }

    .boat {
      position: absolute;
      bottom: 35px;
      left: 50%;
      width: 100px;
      height: auto;
      transform: translateX(-50%);
      animation: boatSwell 7s ease-in-out infinite;
      z-index: 10;
    }

    @keyframes wave {
      0% { margin-left: 0; }
      100% { margin-left: -100%; }
    }

    @keyframes swell {
      0%, 100% { transform: translate3d(0, -25px, 0); }
      50% { transform: translate3d(0, 5px, 0); }
    }

    @keyframes boatSwell {
      0%, 100% { transform: translate(-50%, -25px); }
      50% { transform: translate(-50%, 5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .wave,
      .wave:nth-of-type(2),
      .boat {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="ocean">
    <div class="wave"></div>
    <div class="wave"></div>
    <img class="boat" src="https://th.bing.com/th/id/R.088027e2444827b02fe64d07ffd379ea?rik=57IYFbOU7GrhyQ&riu=http%3a%2f%2fclipart-library.com%2fimages%2fqiBAy5jrT.png&ehk=7rol3AOOJn1TIyRibrtSVhNgUfBffNIi1E4VBUP5nYM%3d&risl=&pid=ImgRaw&r=0" alt="Boat">
  </div>
</body>
</html>
